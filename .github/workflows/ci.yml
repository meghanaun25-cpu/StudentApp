name: StudentApp CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff bandit

      - name: Build Application
        run: |
          python -m zipfile -c StudentApp.zip app.py test_app.py requirements.txt

      - name: Run Unit Tests
        run: python -m pytest -v

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Bandit
        run: python -m bandit -r app.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentApp-Build
          path: StudentApp.zip